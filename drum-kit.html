 (function tick(){clearCues();const s=q[k]||[];
  if(mode=='listen')s.forEach(id=>{S[id]();flash(id)});
  else{if(k%2==0)osc('square',1000,990,.03,.12);(q[k+1]||[]).forEach(id=>el[id].classList.add('cue'))}
  if(k>=q.length-1){tm=setTimeout(()=>end(PL),dur+250);return}
  k++;tm=setTimeout(tick,Math.max(0,t0+k*dur-performance.now()))})();
}
function judge(id){const j=Math.round((performance.now()-PL.t0)/PL.dur),s=PL.seq[j];if(s&&s.includes(id)&&!PL.d[j+id]){PL.d[j+id]=1;PL.h++}}
// views
function openL(i){if(i>=L.length){cur=null;R();return}stopAll();cur=i;R();startGuide(L[i].s,()=>{sv['l'+i]=1;save();say('Well done!');$('fin').innerHTML=i+1<L.length?`<button class="b go" onclick="openL(${i+1})">Next lesson</button>`:'<p>You finished all lessons!</p>'})}
function hearL(){const i=cur,l=L[i];stopAll();runSeq(l.s,450,'listen',()=>{openL(i)})}
function openS(i){stopAll();cur=i;R()}
function songMode(m){const s=SG[cur],d=30000/s.bpm,i=cur;
 if(m=='listen'){runSeq(songSeq(s,Math.ceil(24/s.len)),d,'listen',()=>say('Done.'));say('Listen...')}
 else if(m=='follow'){startGuide(songSeq(s,1).filter(x=>x.length),()=>say('Great! Now try Play along.'))}
 else{say('Get ready...');runSeq(songSeq(s,Math.ceil(32/s.len)),d,'play',p=>{const pc=p.h/p.tot,st=pc>=.9?3:pc>=.6?2:1;if(!sv['s'+i]||sv['s'+i]<st){sv['s'+i]=st;save()}say('You hit '+p.h+' of '+p.tot+'<br>'+'★'.repeat(st)+'☆'.repeat(3-st));PL=null})}}
function R(){R0();box.insertAdjacentHTML('beforeend','<p class="ft">Development with the assistance of AI. Mistakes can occur.</p>')}
function R0(){document.body.className=tab=='play'?'free':'';place();['play','learn','songs'].forEach(t=>$('t_'+t).className=t==tab?'on':'');
 if(tab=='play'){box.innerHTML='<h2>Free play</h2><p>Tap the drums. Use two fingers to hit two drums.</p><p>Want to learn? Tap LEARN. Want a song? Tap SONGS.</p>'}
 else if(tab=='learn'){
  if(cur==null)box.innerHTML='<h2>Lessons</h2><div class="g">'+L.map((l,i)=>`<button class="b" onclick="openL(${i})">${sv['l'+i]?'✓ ':''}${i+1}. ${l.t}</button>`).join('')+'</div>';
  else{const l=L[cur];box.innerHTML=`<h2>${cur+1}. ${l.t}</h2><p>${l.d}</p><p>Tap the glowing drums.</p><div id="pr"></div><div class="row"><button class="b bk" onclick="hearL()">Hear it</button><button class="b bk" onclick="setTab('learn')">All lessons</button></div><div id="fin"></div>`}}
 else{
  if(cur==null){let h='<div class="g">';[1,2,3].forEach(v=>{h+=`<div class="lv">${LV[v]}</div>`;SG.forEach((s,i)=>{if(s.lv==v)h+=`<button class="b" onclick="openS(${i})">${'★'.repeat(sv['s'+i]||0)}${sv['s'+i]?' ':''}${s.n}</button>`})});box.innerHTML=h+'</div>'}
  else{const s=SG[cur],ds=s.tr.map(t=>N[t[0]]).join(', ');box.innerHTML=`<h2>${s.n}</h2><p>Drums: ${ds}</p><p>1. Listen. 2. Follow me. 3. Play along.</p><div id="pr"></div><div class="row"><button class="b bk" onclick="songMode('listen')">1 Listen</button><button class="b bk" onclick="songMode('follow')">2 Follow me</button><button class="b go" onclick="songMode('play')">3 Play along</button></div><div class="row"><button class="b bk" onclick="setTab('songs')">All songs</button></div>`}}}
R();
</script></body></html>
